<!DOCTYPE html>
<html>
  <head>
   <script src="https://aframe.io/releases/1.0.0/aframe.min.js"></script> 

  </head>
  <body>
    <a-scene>
      <a-sky color="#050510"></a-sky>

      
      

      <a-sphere 
        position="0 2 -4" 
        radius="0.6" 
        color="#ff2d55"
        animation__color="property: color; 
                          to: #00f0ff; 
                          dur: 3000; 
                          dir: alternate; 
                          loop: true"
        animation__scale="property: scale; 
                          to: 1.4 1.4 1.4; 
                          dur: 1500; 
                          dir: alternate; 
                          loop: true; 
                          easing: easeInOutQuad"
        animation__position="property: position; 
                             to: 0 2.3 -4; 
                             dur: 2000; 
                             dir: alternate; 
                             loop: true; 
                             easing: easeInOutSine">
      </a-sphere>

      <a-torus 
        position="0 2 -4" 
        radius="1.2" 
        radius-tubular="0.03" 
        color="#00ffaa"
        material="opacity: 0.8; transparent: true"
        animation__rotation="property: rotation; 
                             to: 360 360 0; 
                             dur: 6000; 
                             loop: true; 
                             easing: linear"
        animation__opacity="property: material.opacity; 
                            to: 0.2; 
                            dur: 2000; 
                            dir: alternate; 
                            loop: true">
      </a-torus>

      <a-box 
        position="-2.5 1.5 -5" 
        width="0.6" height="2" depth="0.6" 
        color="#ffcc00"
        animation="property: rotation; 
                   to: 0 360 0; 
                   dur: 5000; 
                   loop: true; 
                   easing: linear">
      </a-box>

      <a-cone 
        position="2.5 0.5 -5" 
        radius-bottom="0.5" height="1.5" 
        color="#ff00ff"
        animation="property: position; 
                   to: 2.5 2.5 -5; 
                   dur: 4000; 
                   dir: alternate; 
                   loop: true; 
                   easing: easeInOutCubic">
      </a-cone>

      <a-cylinder 
        position="0 0.1 -4" 
        radius="1.5" height="0.1" 
        color="#222"
        animation="property: visible; 
                   from: true; 
                   to: false; 
                   dur: 1000; 
                   dir: alternate; 
                   loop: true; 
                   easing: step">
      </a-cylinder>

      <a-dodecahedron 
        position="-1.5 3.5 -3" 
        radius="0.3" 
        color="#7000ff"
        animation="property: scale; 
                   to: 0.1 0.1 0.1; 
                   dur: 1200; 
                   dir: alternate; 
                   loop: true; 
                   easing: easeInBack">
      </a-dodecahedron>

      <a-octahedron 
        position="1.5 3.5 -3" 
        radius="0.3" 
        color="#00ff33"
        animation="property: rotation; 
                   to: 0 0 360; 
                   dur: 2500; 
                   loop: true; 
                   easing: linear">
      </a-octahedron>


      
    </a-scene>
  </body>
</html>
